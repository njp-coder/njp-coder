<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="NJPX flight deck: Nagajyothi Prakash, aeronautical engineer turned CTO">
<style>
  text{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#F3EFE8}
  .hud line,.hud path,.hud circle{stroke:#FF914D;fill:none;stroke-width:1.4}
  .hud text{fill:#FF914D;font-size:10px}
  .k{font-size:11px;letter-spacing:3px;fill:#FF914D}
  .name{font-size:34px;font-weight:700;letter-spacing:-0.5px}
  .sub{font-size:13px;fill:#8b8780}
  .typed{font-size:14px;fill:#F3EFE8}
  .stat{font-size:11px;fill:#8b8780;letter-spacing:1px}
  .stat tspan.v{fill:#FF914D}
  .horizon{animation:bank 9s ease-in-out infinite;transform-origin:650px 150px}
  @keyframes bank{0%,100%{transform:rotate(-6deg) translateY(4px)}50%{transform:rotate(5deg) translateY(-6px)}}
  .tape{animation:hdg 14s linear infinite}
  @keyframes hdg{to{transform:translateX(-480px)}}
  .type{animation:type 3.2s steps(49) .6s both}
  @keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .type{transform-box:fill-box;transform-origin:left center}
  .caret{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .wing{animation:flut .09s linear infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes flut{to{transform:scaleY(.35)}}
  .scan{animation:scan 6s linear infinite}
  @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(300px)}}
</style>
<defs>
  <clipPath id="ball"><circle cx="650" cy="150" r="102"/></clipPath>
  <clipPath id="tapeClip"><rect x="550" y="8" width="200" height="22"/></clipPath>
  <clipPath id="typeClip"><rect class="type" x="40" y="168" width="418.04999999999995" height="24"/></clipPath>
  <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".018"/></pattern>
  <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF914D" stop-opacity="0"/><stop offset="1" stop-color="#FF914D" stop-opacity=".07"/></linearGradient>
</defs>
<rect width="840" height="300" rx="18" fill="#0b0b0c"/>
<rect width="840" height="300" rx="18" fill="url(#lines)"/>
<rect class="scan" x="0" y="0" width="840" height="20" fill="url(#glow)"/>

<!-- left: identity -->
<text x="40" y="62" class="k">CALLSIGN // NJPX</text>
<text x="40" y="112" class="name">Nagajyothi Prakash</text>
<text x="40" y="142" class="sub">aeronautical engineer → technical architect → CTO</text>
<g clip-path="url(#typeClip)"><text x="40" y="186" class="typed">&gt; building AI systems that work in the real world</text></g>
<rect class="caret" x="456.04999999999995" y="173" width="8" height="16" fill="#FF914D"/>
<line x1="40" y1="222" x2="470" y2="222" stroke="#2a2a2e"/>
<text x="40" y="250" class="stat">BUILDS LOGGED <tspan class="v">11</tspan>   ·   LAST FLIGHT <tspan class="v">6D AGO</tspan>   ·   ACTIVE THIS MONTH <tspan class="v">3</tspan></text>

<!-- right: attitude indicator -->
<g class="hud">
  <g clip-path="url(#tapeClip)"><g transform="translate(550 26)"><g class="tape"><text x="0" y="0" text-anchor="middle">N</text><line x1="20" y1="-14" x2="20" y2="-10"/><text x="40" y="0" text-anchor="middle">030</text><line x1="60" y1="-14" x2="60" y2="-10"/><text x="80" y="0" text-anchor="middle">060</text><line x1="100" y1="-14" x2="100" y2="-10"/><text x="120" y="0" text-anchor="middle">E</text><line x1="140" y1="-14" x2="140" y2="-10"/><text x="160" y="0" text-anchor="middle">120</text><line x1="180" y1="-14" x2="180" y2="-10"/><text x="200" y="0" text-anchor="middle">150</text><line x1="220" y1="-14" x2="220" y2="-10"/><text x="240" y="0" text-anchor="middle">S</text><line x1="260" y1="-14" x2="260" y2="-10"/><text x="280" y="0" text-anchor="middle">210</text><line x1="300" y1="-14" x2="300" y2="-10"/><text x="320" y="0" text-anchor="middle">240</text><line x1="340" y1="-14" x2="340" y2="-10"/><text x="360" y="0" text-anchor="middle">W</text><line x1="380" y1="-14" x2="380" y2="-10"/><text x="400" y="0" text-anchor="middle">300</text><line x1="420" y1="-14" x2="420" y2="-10"/><text x="440" y="0" text-anchor="middle">330</text><line x1="460" y1="-14" x2="460" y2="-10"/><text x="480" y="0" text-anchor="middle">N</text><line x1="500" y1="-14" x2="500" y2="-10"/><text x="520" y="0" text-anchor="middle">030</text><line x1="540" y1="-14" x2="540" y2="-10"/><text x="560" y="0" text-anchor="middle">060</text><line x1="580" y1="-14" x2="580" y2="-10"/><text x="600" y="0" text-anchor="middle">E</text><line x1="620" y1="-14" x2="620" y2="-10"/><text x="640" y="0" text-anchor="middle">120</text><line x1="660" y1="-14" x2="660" y2="-10"/><text x="680" y="0" text-anchor="middle">150</text><line x1="700" y1="-14" x2="700" y2="-10"/><text x="720" y="0" text-anchor="middle">S</text><line x1="740" y1="-14" x2="740" y2="-10"/><text x="760" y="0" text-anchor="middle">210</text><line x1="780" y1="-14" x2="780" y2="-10"/><text x="800" y="0" text-anchor="middle">240</text><line x1="820" y1="-14" x2="820" y2="-10"/><text x="840" y="0" text-anchor="middle">W</text><line x1="860" y1="-14" x2="860" y2="-10"/><text x="880" y="0" text-anchor="middle">300</text><line x1="900" y1="-14" x2="900" y2="-10"/><text x="920" y="0" text-anchor="middle">330</text><line x1="940" y1="-14" x2="940" y2="-10"/></g></g></g>
  <path d="M650 34 l-5 7 h10 z" fill="#FF914D"/>
  <circle cx="650" cy="150" r="118" stroke-opacity=".35"/>
  <line x1="567.9756133823605" y1="67.97561338236048" x2="572.9253608506663" y2="72.92536085066631"/><line x1="592" y1="49.54105316100511" x2="598" y2="59.93335800641837"/><line x1="610.3256633742225" y1="40.99565598883463" x2="612.7198043775021" y2="47.57350433433598"/><line x1="629.856811390636" y1="35.76230065058387" x2="631.0723486343046" y2="42.65595492166932"/><line x1="650" y1="34" x2="650" y2="46"/><line x1="670.143188609364" y1="35.76230065058387" x2="668.9276513656954" y2="42.65595492166932"/><line x1="689.6743366257776" y1="40.99565598883464" x2="687.2801956224979" y2="47.57350433433599"/><line x1="708" y1="49.541053161005124" x2="702" y2="59.93335800641839"/><line x1="732.0243866176395" y1="67.97561338236049" x2="727.0746391493337" y2="72.92536085066632"/>
  <g clip-path="url(#ball)"><g class="horizon">
    <rect x="450" y="150" width="400" height="200" fill="#FF914D" fill-opacity=".09" stroke="none"/>
    <line x1="450" y1="150" x2="850" y2="150" stroke-width="2"/>
    <line x1="604" y1="214" x2="632" y2="214" stroke-dasharray="6 5"/><line x1="668" y1="214" x2="696" y2="214" stroke-dasharray="6 5"/>
      <text x="598" y="218" text-anchor="end">20</text><text x="702" y="218">20</text><line x1="580" y1="182" x2="632" y2="182" stroke-dasharray="6 5"/><line x1="668" y1="182" x2="720" y2="182" stroke-dasharray="6 5"/>
      <text x="574" y="186" text-anchor="end">10</text><text x="726" y="186">10</text><line x1="580" y1="118" x2="632" y2="118" /><line x1="668" y1="118" x2="720" y2="118" />
      <text x="574" y="122" text-anchor="end">10</text><text x="726" y="122">10</text><line x1="604" y1="86" x2="632" y2="86" /><line x1="668" y1="86" x2="696" y2="86" />
      <text x="598" y="90" text-anchor="end">20</text><text x="702" y="90">20</text>
  </g></g>
  <path d="M588 150 h40 l10 12 l10 -12 l10 12 l10 -12 h40" stroke-width="2.4" stroke="#F3EFE8"/>
  <circle cx="650" cy="150" r="3" fill="#F3EFE8" stroke="none"/>
  <text x="650" y="290" text-anchor="middle" style="letter-spacing:3px">ALT ▸ CTO</text>
</g>

<!-- signature: a dragonfly crosses the deck -->
<g opacity=".95">
  <g><g transform="scale(1.5)">
    <path d="M-14 0 h30" stroke="#F3EFE8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="17" cy="0" r="3.4" fill="#F3EFE8"/>
    <ellipse class="wing" cx="4" cy="-8" rx="4" ry="9" fill="#FF914D" fill-opacity=".55" transform="rotate(-20 4 -8)"/>
    <ellipse class="wing" cx="4" cy="8" rx="4" ry="9" fill="#FF914D" fill-opacity=".55" transform="rotate(20 4 8)"/>
    <ellipse class="wing" cx="-3" cy="-8" rx="3.4" ry="8" fill="#FF914D" fill-opacity=".4" transform="rotate(25 -3 -8)"/>
    <ellipse class="wing" cx="-3" cy="8" rx="3.4" ry="8" fill="#FF914D" fill-opacity=".4" transform="rotate(-25 -3 8)"/></g>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto" keyPoints="0;0;1" keyTimes="0;.45;1" calcMode="linear"
      path="M-40 236 C 160 150, 300 300, 470 200 S 700 40, 900 90"/>
  </g>
</g>
</svg>