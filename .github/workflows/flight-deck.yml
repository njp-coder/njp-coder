name: flight-deck

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the deck changed
        run: |
          git config user.name "flight-deck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "flight deck: daily update" && git push)
